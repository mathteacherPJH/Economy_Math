<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>경제수학 — 2022 개정 교육과정</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css?v=2" />

<!-- 수식 렌더링 (분수 등은 항상 MathJax의 \frac 문법으로 작성) -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$']],
      displayMath: [['$$', '$$']]
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
    }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>

<div class="app" id="app">

  <!-- ================= 사이드바 ================= -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand-mark">경</div>
      <div class="brand-text">
        <div class="brand-title">경제수학</div>
        <div class="brand-sub">2022 개정 교육과정</div>
      </div>
      <button class="collapse-btn" id="collapseBtn" aria-label="사이드바 접기/펼치기">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <nav class="toc" id="toc" aria-label="단원 목차"></nav>
  </aside>

  <!-- ================= 메인 슬라이드 영역 ================= -->
  <main class="main">
    <div class="stage-header">
      <div class="stage-eyebrow" id="stageEyebrow"></div>
      <div class="stage-tools">
        <div class="blank-toolbar" id="blankToolbar">
          <button class="draw-btn" id="blankAddBtn" type="button" aria-pressed="false" aria-label="빈칸 추가/편집">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="2.5" y="4" width="11" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M6 8h4M8 6v4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </button>
          <span class="draw-toolbar-divider"></span>
          <input class="blank-fontsize" id="blankFontSize" type="number" min="8" max="72" step="1" value="35" aria-label="빈칸 글자 크기(px)" title="글자 크기(px)" />
          <span class="zoom-unit">px</span>
          <span class="draw-toolbar-divider"></span>
          <button class="draw-btn" id="blankClearBtn" type="button" aria-label="빈칸 전체 초기화">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 4h10M6.5 4V2.5h3V4M4.5 4l.5 9.5h6l.5-9.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="draw-toolbar" id="drawToolbar">
          <button class="draw-btn" id="penBtn" type="button" aria-pressed="false" aria-label="펜">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M11 2l3 3-8 8-3.5 1 1-3.5 8-8z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          </button>
          <button class="draw-btn" id="eraserBtn" type="button" aria-pressed="false" aria-label="지우개">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M10.5 2.5l3 3-7 7H4l-2-2 8.5-8z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          </button>
          <span class="draw-toolbar-divider"></span>
          <input class="draw-color" id="penColor" type="color" value="#F43F5E" aria-label="펜 색깔" />
          <input class="draw-width" id="penWidth" type="range" min="1" max="24" value="4" aria-label="펜촉 굵기" />
          <span class="draw-toolbar-divider"></span>
          <button class="draw-btn" id="undoBtn" type="button" aria-label="실행 취소">&#8630;</button>
          <button class="draw-btn" id="redoBtn" type="button" aria-label="다시 실행">&#8631;</button>
          <button class="draw-btn" id="clearBtn" type="button" aria-label="전체 지우기">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 4h10M6.5 4V2.5h3V4M4.5 4l.5 9.5h6l.5-9.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="zoom-group">
          <button class="zoom-btn" id="zoomOutBtn" type="button" aria-label="축소">&#8722;</button>
          <input class="zoom-input" id="zoomInput" type="number" min="25" max="300" step="5" value="100" aria-label="확대/축소 비율" />
          <span class="zoom-unit">%</span>
          <button class="zoom-btn" id="zoomInBtn" type="button" aria-label="확대">&#43;</button>
        </div>
        <button class="fullscreen-btn" id="fullscreenBtn">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M2 6V2H6M10 2H14V6M14 10V14H10M6 14H2V10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          발표 모드
        </button>
      </div>
    </div>

    <div class="stage" id="stage"></div>

    <div class="stage-footer" id="stageFooter"></div>
  </main>

</div>

<!-- ================= 우측 관련 영상 레일 (항상 접힌 상태로 시작) ================= -->
<aside class="video-rail" id="videoRail">
  <button class="video-rail-toggle" id="videoRailToggle" aria-label="관련 영상 목록 펼치기/접기" aria-expanded="false">
    <span class="video-rail-toggle-arrow">&#8249;</span>
  </button>
  <div class="video-rail-panel">
    <p class="video-rail-title">관련 영상</p>
    <div class="video-rail-list" id="videoRailList"></div>
  </div>
</aside>

<!-- ================= 영상 전체화면 플로팅 모달 ================= -->
<div class="video-modal" id="videoModal">
  <div class="video-modal-backdrop" id="videoModalBackdrop"></div>
  <div class="video-modal-body">
    <button class="video-modal-close" id="videoModalClose" aria-label="영상 닫기">&#215;</button>
    <div class="video-modal-frame" id="videoModalFrame"></div>
  </div>
</div>

<script src="data.js?v=2"></script>
<script src="script.js?v=2"></script>
</body>
</html>
